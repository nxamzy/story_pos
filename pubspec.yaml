name: ocam_pos
description: "Ocam POS — do'kon va savdo nuqtalari uchun boshqaruv tizimi."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Dependency injection
  get_it: ^8.0.3

  # Firebase (hozircha backend sifatida)
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3

  # Navigatsiya va UI
  go_router: ^17.0.1
  persistent_bottom_nav_bar: ^6.2.1
  cupertino_icons: ^1.0.8

  # Skanerlash va chek chiqarish
  mobile_scanner: ^7.2.0
  pretty_qr_code: ^3.6.0
  pdf: ^3.11.3
  printing: ^5.14.2

  # Yordamchi
  intl: ^0.18.1
  url_launcher: ^6.3.2

  # Mijoz/chek ma'lumotini tizim ulashish oynasi orqali yuborish
  share_plus: ^12.0.0

  # Kassir PIN kodini xeshlab saqlash uchun (ochiq matnda saqlanmaydi)
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.0.0
  flutter_lints: ^6.0.0

flutter:


  uses-material-design: true

